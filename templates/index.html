<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
       body {
    background: #f2f4f7;
    font-family: Arial, Helvetica, sans-serif;
}

.login-box {
    width: 350px;
    margin: 120px auto;
    padding: 30px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 15px;
    text-align: left;
}

label {
    font-weight: bold;
}



button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #0d6efd;
    color: white;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0b5ed7;
}
    </style>
</head>
<body>
        <h1 style="text-align:center">{{msg}}</h1><br>

        {% for i in messages %}
        {% if 'failed' in i.tags %}
        <h3 style="text-align:center;color: red;">{{i}}</h3>
        {% endif %}
        {% endfor %}

        <div style="text-align:center">
        <form action="{% url 'login_submission' %}" method="POST" autocomplete="off">
            {% csrf_token %}
              <h3>Login Here</h3>
             <label for="username" >Username</label>
                <input type="text" placeholder="Username" id="username" name="username" required ><br><br>

                <label for="password" >Password</label>
                <input type="password" placeholder="Password" id="password" name="password" required><br><br>
            <button type="submit" style="color:white;background-color:blue">Login</button>

        </form>
            </div>

</body>
</html>
